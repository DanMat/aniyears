name: refresh

# Keeps AniYears current with zero manual work: pulls my list from the MyAnimeList
# API, re-processes it against the anime-offline-database, enriches new anime with
# seiyuu (cached — only *new* titles hit AniList), commits changed data, redeploys.

on:
  schedule:
    - cron: '0 9 * * *' # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download anime-offline-database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo manami-project/anime-offline-database --pattern 'anime-offline-database-minified.json' -O scripts/aod.json --clobber

      - name: Pull + process + enrich
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "::error::MAL_CLIENT_ID secret not set — add the same MAL API client id used by mal-rater."
            exit 1
          fi
          node scripts/pull.mjs
          node scripts/process.mjs
          node scripts/seiyuu.mjs

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain public/data scripts/seiyuu-cache.json)" ]; then
            git config user.name "aniyears-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data scripts/seiyuu-cache.json
            git commit -m "chore: refresh anime data [skip ci]"
            git push
            echo "Data updated."
          else
            echo "No changes."
          fi

      - name: Build + deploy
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — data committed but not redeployed. Add it to auto-publish."
            exit 0
          fi
          pnpm build
          pnpm exec wrangler deploy
